# After a push to main, wait for Railway to serve the new build, then smoke
# test production. Opens an issue on failure; roll back by redeploying the
# previous deployment in Railway.
name: postdeploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Wait for the deploy to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$SITE_URL/api/v1/health" >/dev/null; then exit 0; fi
            sleep 10
          done
          echo "healthcheck never passed" >&2; exit 1

      - name: Smoke test production
        run: node scripts/smoke.js --url="$SITE_URL"

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Post-deploy smoke test failed for ${GITHUB_SHA::7}" \
            --body "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Roll back by redeploying the previous deployment in Railway."
