# Litestream continuous replication of the SQLite file to an S3-compatible
# bucket. Values come from the environment (see CLAUDE.md → Environment).
dbs:
  - path: ${DATA_DIR}/app.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: app.db
        endpoint: ${LITESTREAM_ENDPOINT}
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        sync-interval: 1s
        retention: 72h
